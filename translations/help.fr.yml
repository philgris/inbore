dashboard: |
    TIP : Pour les écrans de petites tailles des portables (15" ou inf). Racourcis pour scroller horizontalement les listes d'enregistrements :
        ----> touches flèches : cliquez dans la liste et utilisez les flèches droite [->] ou gauche [<-] 
        ----> touche Shift + Molette de la souris : cliquez dans la liste et maintenez la touche touche Shift enfoncée et utilisez la molette de la souris

    TIP : Pour les écrans de petites tailles des portables (15" ou inf). Pour optimiser l'affichage et la lecture de la liste vous pouvez :
        ----> masquer (i) le menu de gauche (ii) certaines colonnes : (i) cliquez sur l'icone Menu en haut à gauche de l'écran (ii) décochez le(s) colonne(s) via l'icone Menu en haut à droite de la liste
        ----> diminuer la taille des caractères des textes : appuyez simultanément sur les touches [Ctrl] + [-] ( [Ctrl] + [+] pour augmenter)
        
    TIP : Utiliser des options de filtrage avancé pour les champs de type Date ou numérique en utilisant les caractères : égal, inférieur, supérieur et deux-points, point-virgule (nombre uniquement)
        ----> exemple de filtre pour les Dates : (i) "=2026-01" == les dates = 2026-01-* (ii) ">2025" == les dates >= 2026-01-01  (iii)  "=2025:2025-05" ==  les dates entre [2025-01-01;2025-06-01]
        ----> exemple de filtre pour les nombres : (i) "=10" ==  le nombre égal à 10  (ii)  "=10:20" ==  les nombres entre [10;20] (iii)  "=10;20" == les nombres  10 et 20   

